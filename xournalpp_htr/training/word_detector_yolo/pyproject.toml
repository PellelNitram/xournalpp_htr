[project]
name = "experiment-yolo"
version = "0.1.0"
description = "Fine-tune YOLOv8s for handwritten word detection on IAM dataset"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.2.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "tensorboard>=2.14.0",
    "gradio>=4.0.0",
    "torch>=2.6.0,<2.8.0",
    "torchvision>=0.21.0,<0.23.0",
]

[tool.uv]
dev-dependencies = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
